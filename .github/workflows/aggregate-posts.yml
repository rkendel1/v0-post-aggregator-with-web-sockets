name: Aggregate Posts

# This workflow runs automated aggregation jobs to fetch posts from external sources
# It runs on a schedule and can also be triggered manually

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  
  # Allow manual triggering from Actions tab
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Poll RSS Feeds
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            ${{ secrets.SUPABASE_URL }}/functions/v1/poll-all-feeds)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "Error: RSS polling failed with status $http_code"
            exit 1
          fi
      
      - name: Aggregate Connected Accounts
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            ${{ secrets.SUPABASE_URL }}/functions/v1/aggregate-connected-accounts)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "Error: Account aggregation failed with status $http_code"
            exit 1
          fi
      
      - name: Report Success
        if: success()
        run: echo "✅ Aggregation completed successfully"
      
      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Aggregation failed"
          echo "Check the logs above for details"
